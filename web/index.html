<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WWLLM Lecture Studio</title>
  <meta name="description" content="Turn multilingual lecture recordings into synced transcripts, structured notes, practice quizzes and translations into Indian languages.">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff9f2e'/%3E%3Cpath d='M7 14.5v3M10.5 11v10M14 8.5v15' stroke='%231b1003' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M18.5 11h6M18.5 16h6M18.5 21h4' stroke='%231b1003' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script>
    // Apply the saved theme before first paint (no flash).
    try {
      const t = localStorage.getItem("wwllm.theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      else document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    } catch (_) {}
  </script>
  <script type="module" src="/assets/js/main.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/studio" aria-label="WWLLM Lecture Studio — home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="var(--accent)"/>
          <path d="M7 14.5v3M10.5 11v10M14 8.5v15" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M18.5 11h6M18.5 16h6M18.5 21h4" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <span class="brand-text"><b>WWLLM</b><span>Lecture Studio</span></span>
      </a>

      <nav class="nav" aria-label="Primary">
        <a href="#/studio" data-route="studio">Studio</a>
        <a href="#/benchmark" data-route="benchmark">Benchmark</a>
      </nav>

      <div class="topbar-right">
        <button class="search-pill" id="searchBtn" type="button" aria-label="Search the lecture and commands">
          <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <span>Search any script</span><kbd>Ctrl K</kbd>
        </button>
        <button class="engine-pill" id="enginePill" type="button" aria-haspopup="dialog">
          <span class="pill-dot"></span><span class="pill-label">Checking engines…</span>
        </button>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle light and dark theme" title="Toggle theme (T)"></button>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="site-footer">
    <span id="footerEngines">WWLLM v2</span>
    <span class="footer-keys"><kbd>Ctrl K</kbd> search <kbd>Space</kbd> play <kbd>F</kbd> theatre <kbd>?</kbd> shortcuts</span>
  </footer>

  <dialog class="sheet" id="enginesDialog" aria-labelledby="enginesTitle"></dialog>
  <dialog class="sheet" id="pasteDialog" aria-labelledby="pasteTitle"></dialog>
  <dialog class="sheet sheet-sm" id="keysDialog" aria-labelledby="keysTitle"></dialog>
  <dialog class="palette" id="palette" aria-label="Search the lecture"></dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
</body>
</html>
